<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2D Striker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050515;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Essential for zero touch latency */
        canvas {
            display: block;
            touch-action: none;
            background: #0a0a23;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Responsive Resolution Scaling
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game State
        const paddle = {
            width: Math.max(100, canvas.width * 0.25),
            height: 16,
            x: canvas.width / 2 - 50,
            y: canvas.height - 40,
            color: '#00f0ff'
        };

        // Instant Touch Sensing (No lag)
        function handleTouch(e) {
            e.preventDefault(); // Prevents scroll/zoom delay
            if (e.touches.length > 0) {
                const touchX = e.touches[0].clientX;
                // Center the paddle on finger
                paddle.x = touchX - paddle.width / 2;

                // Keep paddle inside screen bounds
                if (paddle.x < 0) paddle.x = 0;
                if (paddle.x + paddle.width > canvas.width) {
                    paddle.x = canvas.width - paddle.width;
                }
            }
        }

        // Attach direct, non-passive touch listeners
        canvas.addEventListener('touchstart', handleTouch, { passive: false });
        canvas.addEventListener('touchmove', handleTouch, { passive: false });

        // Mouse backup for desktop testing
        canvas.addEventListener('mousemove', (e) => {
            paddle.x = e.clientX - paddle.width / 2;
        });

        // Smooth 60 FPS Game Loop
        function gameLoop() {
            // Clear Frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Paddle
            ctx.fillStyle = paddle.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = paddle.color;
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 8);
            ctx.fill();

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
